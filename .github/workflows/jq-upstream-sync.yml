name: Sync jq Upstream Fixtures

on:
  schedule:
    - cron: "20 3 * * 1"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "jq upstream ref to sync (branch/tag/sha)"
        required: false
        default: "master"
        type: string
      force_sync:
        description: "Force re-sync even when vendored files match upstream"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  sync:
    name: Sync Fixtures
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      UPSTREAM_REF: ${{ github.event.inputs.upstream_ref || 'master' }}
      FORCE_SYNC: ${{ github.event.inputs.force_sync || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: MoonBit Version
        run: moon version --all

      - name: Install jq (latest)
        uses: ./.github/actions/install-jq

      - name: jq Version
        run: jq --version

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update vendored jq tests and derived ledgers
        run: bash ./scripts/update_jq_tests.sh

      - name: Detect changes
        id: detect
        shell: bash
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub App token
        id: app-token
        if: steps.detect.outputs.changed == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.JQX_UPSTREAM_SYNC_APP_ID }}
          private-key: ${{ secrets.JQX_UPSTREAM_SYNC_APP_PRIVATE_KEY }}

      - name: Create or update pull request
        if: steps.detect.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: chore/jq-upstream-sync
          delete-branch: true
          commit-message: "chore: sync jq upstream fixtures"
          title: "chore: sync jq upstream fixtures"
          body: |
            Automated sync of vendored jq upstream fixtures.

            - upstream ref: `${{ env.UPSTREAM_REF }}`
            - workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          add-paths: |
            third_party/jq-tests/**
            scripts/jq_compat_cases.upstream.json
            scripts/jq_upstream_failures.snapshot.json
            scripts/jq_upstream_diff_ledger.md

      - name: No changes
        if: steps.detect.outputs.changed != 'true'
        run: echo "No jq upstream fixture changes detected."
